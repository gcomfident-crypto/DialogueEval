      "evidence_required": "对话中客服明确询问用户是否为负责人，并根据回答采取相应行动（继续或请转达）。",
      "priority": "P0",
      "positive_evidence_examples_description": "客服询问负责人身份并得到肯定或否定回答后，执行对应流程。",
      "negative_evidence_examples_description": "客服未确认身份直接进入后续流程。"
    },
    {
      "label": "awareness_check",
