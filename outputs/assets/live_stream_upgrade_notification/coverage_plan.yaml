      "evidence_required": "客服明确提问用户是否知道后台已走低延迟线路，并根据用户回答（知情/不知情）进行不同解释。",
      "priority": "P0",
      "positive_evidence_examples_description": "客服提出知情确认问题，用户回答后客服给出相应说明。",
